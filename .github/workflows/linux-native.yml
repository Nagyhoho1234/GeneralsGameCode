          echo "Build outcome: ${{ steps.build-renderviewupdatedraw.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-renderviewupdatedraw.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "The real, unmodified W3DView::update()/drawView()(->draw())/pickDrawable() run their full, always-executed control flow in an empty-world configuration, on top of real TheGameLogic/TheScriptEngine and minimal concrete stub subclasses for GameClient/InGameUI/Display/FontLibrary/Mouse - the first GameLogic, ScriptEngine, GameClient, InGameUI, Display, and FontLibrary ever constructed and executed on POSIX. Includes pickDrawable()'s real ray-cast chain (screen ray -> world ray -> RTS3DScene::castRay -> user-data extraction), hit and miss both checked against a sentinel DrawableInfo. Landed in two passes: a first attempt shipped pickDrawable() alone after finding a much larger link closure than estimated (a stub subclass overriding only an abstract base's pure virtuals still forces the linker to pull in the base's full real .cpp, since vtables need every virtual method resolved); a retry adopted Milestone 10's technique of linking the real source closure wholesale instead of hand-picked files, which resolved the closure and delivered the full original scope. Milestone 11's exit criterion." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
