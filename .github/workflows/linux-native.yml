          echo "Real TheAI/TheGameLogic/TheScriptEngine/TheTerrainLogic/ThePartitionManager constructed through the engine's own real code and code paths, deliberately bypassing GameEngine::init()/execute()'s real display-layer dependencies. Calls the real, unmodified GameLogic::UPDATE() five times, asserting the real frame counter and hasUpdated() flag advance correctly each tick - no GL/display dependency at all. Milestone 10's exit criterion." >> $GITHUB_STEP_SUMMARY
