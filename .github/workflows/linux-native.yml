name: Linux Native Build (advisory - currently-portable subset only)

# Tracks progress against docs/native-port-plan.md. Native port Phase 1
# (build-system gating + GameEngine core Win32 removal) and Phase 2
# (64-bit pointer-width cleanliness) are both done for the currently
# reachable subset of the codebase: Core/GameEngine and
# Core/GameEngineDevice's non-D3D8/non-Win32 sources, for both Generals
# and GeneralsMD. This workflow builds exactly that subset
# (g_gameenginedevice/z_gameenginedevice) using the new linux-x64
# CMake preset (already validated locally on WSL2 Ubuntu 26.04, 0
# unique pointer-width errors remaining) - it does NOT attempt the
# full game executable, which still needs Phase 3-7 (rendering/audio/
# windowing) before it links.
#
# Manually triggered only (not on every push/PR) to avoid CI noise on
# a target that isn't part of the mergeable, upstream-shipping build
# yet.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  linux-build-attempt:
    name: Build g_gameenginedevice/z_gameenginedevice on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-utils xvfb

      - name: Show toolchain versions
        run: |
          echo "### Toolchain" >> $GITHUB_STEP_SUMMARY
          g++ --version | tee -a $GITHUB_STEP_SUMMARY
          cmake --version | tee -a $GITHUB_STEP_SUMMARY
          ninja --version | tee -a $GITHUB_STEP_SUMMARY
          uname -a | tee -a $GITHUB_STEP_SUMMARY

      - name: Configure (linux-x64 preset - native, no vcpkg)
        id: configure
        run: cmake --preset linux-x64 -DRTS_BUILD_TESTS=ON 2>&1 | tee configure-log.txt

      - name: Build g_gameenginedevice (Generals)
        id: build-generals
        run: cmake --build --preset linux-x64 --target g_gameenginedevice -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build z_gameenginedevice (Zero Hour)
        id: build-zerohour
        run: cmake --build --preset linux-x64 --target z_gameenginedevice -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderDeviceInitTest (Phase 5(a) Milestone 1 - GL device backend)
        id: build-renderdeviceinit
        run: cmake --build --preset linux-x64 --target RenderDeviceInitTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderDeviceInitTest (headless Mesa software rendering)
        id: run-renderdeviceinit
        if: steps.build-renderdeviceinit.outcome == 'success'
        # GLFW's X11 backend connects to a display at glfwInit() time even
        # for a hidden window - bare GitHub-hosted runners have no X server
        # at all (unlike WSL2, which has one via WSLg), so xvfb-run supplies
        # a virtual one. Rendering itself still goes to an offscreen FBO via
        # Mesa software rendering, never to a visible window.
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/linux-x64/Tests/RenderDeviceInit/RenderDeviceInitTest 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderTexturedTriangleTest (Phase 5(a) Milestone 2 - device-object-level draw call API)
        id: build-rendertexturedtriangle
        run: cmake --build --preset linux-x64 --target RenderTexturedTriangleTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderTexturedTriangleTest (headless Mesa software rendering)
        id: run-rendertexturedtriangle
        if: steps.build-rendertexturedtriangle.outcome == 'success'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/linux-x64/Tests/RenderTexturedTriangle/RenderTexturedTriangleTest 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderEngineDrawPathTest (Phase 5(a) Milestone 3 - real engine draw path end-to-end)
        id: build-renderenginedrawpath
        run: cmake --build --preset linux-x64 --target RenderEngineDrawPathTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderEngineDrawPathTest (headless Mesa software rendering)
        id: run-renderenginedrawpath
        if: steps.build-renderenginedrawpath.outcome == 'success'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/linux-x64/Tests/RenderEngineDrawPath/RenderEngineDrawPathTest 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderTexturePipelineTest (Phase 5(a) Milestone 4 - texture pipeline end-to-end)
        id: build-rendertexturepipeline
        run: cmake --build --preset linux-x64 --target RenderTexturePipelineTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderTexturePipelineTest (headless Mesa software rendering)
        id: run-rendertexturepipeline
        if: steps.build-rendertexturepipeline.outcome == 'success'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/linux-x64/Tests/RenderTexturePipeline/RenderTexturePipelineTest 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderW3DMeshTest (Phase 5(a) Milestone 5 - real W3D meshes end-to-end)
        id: build-renderw3dmesh
        run: cmake --build --preset linux-x64 --target RenderW3DMeshTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderW3DMeshTest (headless Mesa software rendering)
        id: run-renderw3dmesh
        if: steps.build-renderw3dmesh.outcome == 'success'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/linux-x64/Tests/RenderW3DMesh/RenderW3DMeshTest 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderWW3DFrameTest (Phase 5(a) Milestone 6 - engine-driven frame loop, the milestone's exit criterion)
        id: build-renderww3dframe
        run: cmake --build --preset linux-x64 --target RenderWW3DFrameTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderWW3DFrameTest (headless Mesa software rendering, real GLFW window hosted by Xvfb)
        id: run-renderww3dframe
        if: steps.build-renderww3dframe.outcome == 'success'
        # Unlike the five prior harnesses (all pass windowed=0, hidden window),
        # this harness passes windowed=1 (native-port-plan.md Milestone 6): a
        # real, visible GLFW window. Xvfb hosts visible windows fine (it's a
        # full, if virtual, X server) - rendering itself still goes to the
        # offscreen FBO via Mesa software rendering, same as every other
        # harness; only check 4's window-side readback touches the window's
        # own default framebuffer.
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/linux-x64/Tests/RenderWW3DFrame/RenderWW3DFrameTest 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build GameFileSystemTest (Phase 5(a) Milestone 7 Task 2 - headless file-system harness)
        id: build-gamefilesystem
        run: cmake --build --preset linux-x64 --target GameFileSystemTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run GameFileSystemTest (no display needed - pure headless file-system test)
        id: run-gamefilesystem
        if: steps.build-gamefilesystem.outcome == 'success'
        # No xvfb-run here, unlike every other harness in this workflow: this
        # harness has no GL/display dependency at all (see
        # Tests/GameFileSystem/CMakeLists.txt's own header comment) - it only
        # exercises TheFileSystem/StdBIGFileSystem/StdLocalFileSystem on
        # POSIX for the first time. Invoked via ctest (not the raw binary
        # path, unlike the six RenderXxx harnesses above): this harness's
        # CMakeLists.txt sets add_test(... WORKING_DIRECTORY
        # gamefilesystem_scratch) because StdBIGFileSystem::init() scans its
        # cwd recursively for "*.big" and the harness authors its own
        # test-local archive into that cwd - ctest is what actually applies
        # that WORKING_DIRECTORY, the same way local verification (`ctest
        # --output-on-failure`) already exercises it.
        run: ctest --test-dir build/linux-x64 -R '^GameFileSystemTest$' --output-on-failure 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderGameAssetsTest (Phase 5(a) Milestone 7 Task 4 - the milestone's exit harness)
        id: build-rendergameassets
        run: cmake --build --preset linux-x64 --target RenderGameAssetsTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderGameAssetsTest (headless Mesa software rendering)
        id: run-rendergameassets
        if: steps.build-rendergameassets.outcome == 'success'
        # Like its six RenderXxx siblings above, this harness needs a display
        # for GLFW/GL even though rendering itself goes to an offscreen FBO -
        # xvfb-run supplies the virtual X server bare GitHub-hosted runners
        # lack. Invoked via ctest for the same WORKING_DIRECTORY reason as
        # GameFileSystemTest above (rendergameassets_scratch; this harness
        # authors its own "RenderGameAssets.big" into cwd at runtime).
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build/linux-x64 -R '^RenderGameAssetsTest$' --output-on-failure 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderRTS3DSceneTest (Phase 5(a) Milestone 8 Task 4 - the milestone's payoff task and exit harness)
        id: build-renderrts3dscene
        run: cmake --build --preset linux-x64 --target RenderRTS3DSceneTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderRTS3DSceneTest (headless Mesa software rendering)
        id: run-renderrts3dscene
        if: steps.build-renderrts3dscene.outcome == 'success'
        # Like RenderGameAssetsTest above, this harness needs a display for
        # GLFW/GL even though rendering itself goes to an offscreen FBO -
        # xvfb-run supplies the virtual X server bare GitHub-hosted runners
        # lack. Invoked via ctest for the same WORKING_DIRECTORY reason as
        # GameFileSystemTest/RenderGameAssetsTest above (renderrts3dscene_scratch;
        # this harness authors its own .big archive into cwd at runtime).
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build/linux-x64 -R '^RenderRTS3DSceneTest$' --output-on-failure 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderCameraTransformTest (Phase 5(a) Milestone 9 Task 3 - the milestone's payoff task and exit harness)
        id: build-rendercameratransform
        run: cmake --build --preset linux-x64 --target RenderCameraTransformTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderCameraTransformTest (headless Mesa software rendering)
        id: run-rendercameratransform
        if: steps.build-rendercameratransform.outcome == 'success'
        # Like RenderRTS3DSceneTest above, this harness needs a display for
        # GLFW/GL even though rendering itself goes to an offscreen FBO -
        # xvfb-run supplies the virtual X server bare GitHub-hosted runners
        # lack. Invoked via ctest for the same WORKING_DIRECTORY reason as
        # GameFileSystemTest/RenderGameAssetsTest/RenderRTS3DSceneTest above
        # (rendercameratransform_scratch; this harness authors its own .big
        # archive into cwd at runtime).
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build/linux-x64 -R '^RenderCameraTransformTest$' --output-on-failure 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build GameLogicTickHarnessTest (Phase 5(a) Milestone 10 - rung 2b-lite, headless GameLogic tick harness)
        id: build-gamelogictickharness
        run: cmake --build --preset linux-x64 --target GameLogicTickHarnessTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run GameLogicTickHarnessTest (no display needed - pure headless logic test)
        id: run-gamelogictickharness
        if: steps.build-gamelogictickharness.outcome == 'success'
        # Unlike every rendering harness above, this one has zero GL/display
        # dependency AND no WORKING_DIRECTORY requirement (its add_test() call
        # carries no scratch-cwd archive-authoring step, unlike GameFileSystemTest/
        # RenderGameAssetsTest/RenderRTS3DSceneTest/RenderCameraTransformTest) -
        # it's real TheAI/TheGameLogic/TheScriptEngine/TheTerrainLogic/
        # ThePartitionManager construction and a 5-tick GameLogic::UPDATE() loop,
        # nothing else. Invoked via ctest for consistency with every other entry.
        run: ctest --test-dir build/linux-x64 -R '^GameLogicTickHarnessTest$' --output-on-failure 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderViewUpdateDrawTest (Phase 5(a) Milestone 11 - rung 3b-ii-a, pickDrawable() ray-cast proof)
        id: build-renderviewupdatedraw
        run: cmake --build --preset linux-x64 --target RenderViewUpdateDrawTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderViewUpdateDrawTest (headless Mesa software rendering)
        id: run-renderviewupdatedraw
        if: steps.build-renderviewupdatedraw.outcome == 'success'
        # Like RenderCameraTransformTest above, this harness needs a display for
        # GLFW/GL even though rendering itself goes to an offscreen FBO - xvfb-run
        # supplies the virtual X server bare GitHub-hosted runners lack. Invoked
        # via ctest for the same WORKING_DIRECTORY reason as every scratch-archive
        # harness above (renderviewupdatedraw_scratch).
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build/linux-x64 -R '^RenderViewUpdateDrawTest$' --output-on-failure 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build PosixGameEngineHarnessTest (Phase 5(a) Milestone 12 - rung 2b, the real GameEngine::init()/update()/execute())
        id: build-posixgameenginehariness
        run: cmake --build --preset linux-x64 --target PosixGameEngineHarnessTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run PosixGameEngineHarnessTest (no display needed - pure headless logic test)
        id: run-posixgameenginehariness
        if: steps.build-posixgameenginehariness.outcome == 'success'
        # Like GameFileSystemTest above, this harness has zero GL/display
        # dependency (no WW3D/GLFW involvement at all - grep-confirmed) but
        # does author real state into a scratch cwd, so it needs ctest for
        # the same WORKING_DIRECTORY reason (posixgameengine_scratch).
        run: ctest --test-dir build/linux-x64 -R '^PosixGameEngineHarnessTest$' --output-on-failure 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build RenderNamedDrawableTest (Phase 5(a) Milestones 13/14/16 - rung 3b-ii-b + Phase 4 rung 0)
        id: build-rendernameddrawable
        run: cmake --build --preset linux-x64 --target RenderNamedDrawableTest -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Run RenderNamedDrawableTest (headless Mesa software rendering)
        id: run-rendernameddrawable
        if: steps.build-rendernameddrawable.outcome == 'success'
        # Like RenderViewUpdateDrawTest above, this harness needs a display for
        # GLFW/GL even though rendering itself goes to an offscreen FBO (or a
        # hidden real window - PORTABLE_D3D8_HIDDEN=1 is already set directly
        # on this test's own ctest ENVIRONMENT property by Milestone 16, not
        # duplicated here) - xvfb-run supplies the virtual X server bare
        # GitHub-hosted runners lack either way. Invoked via ctest for the
        # same WORKING_DIRECTORY reason as every scratch-archive harness
        # above (rendernameddrawable_scratch).
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build/linux-x64 -R '^RenderNamedDrawableTest$' --output-on-failure 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Upload configure/build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-attempt-log
          path: configure-log.txt
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### Linux native build attempt (g_gameenginedevice/z_gameenginedevice only)" >> $GITHUB_STEP_SUMMARY
          echo "Build Generals outcome: ${{ steps.build-generals.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Build Zero Hour outcome: ${{ steps.build-zerohour.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Expected: 17 unique error lines each, all already-catalogued deferred items in docs/native-port-plan.md (real COM/ATL work, imagehlp.h, d3dx8math.h, mbstring.h) - not pointer-width or build-system issues. See the uploaded log artifact for exact diagnostics." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 1: GL device backend (Tests/RenderDeviceInit)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-renderdeviceinit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-renderdeviceinit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Expects a real DX8Wrapper::Init/Set_Render_Device/Create_Device/Begin_Scene/Clear/End_Scene cycle against the PortableD3D8 GL backend, verified by reading back an offscreen FBO and checking every pixel matches the requested clear color." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 2: device-object-level draw call API (Tests/RenderTexturedTriangle)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-rendertexturedtriangle.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-rendertexturedtriangle.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Drives CreateVertexBuffer/CreateIndexBuffer/CreateTexture/Lock/Unlock/SetStreamSource/SetIndices/SetTexture/SetRenderState/DrawIndexedPrimitive directly and asserts 6 real pixel-level checks (background integrity, textured sampling, orientation, R/B byte order, cull-mode, depth-test) against the offscreen FBO." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 3: real engine draw path end-to-end (Tests/RenderEngineDrawPath)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-renderenginedrawpath.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-renderenginedrawpath.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Drives DX8VertexBufferClass/DX8IndexBufferClass through real WriteLockClass objects, DX8Wrapper::Set_Vertex_Buffer/Set_Index_Buffer/Set_Shader/Set_Material/Set_Transform/Draw_Triangles, real ShaderClass presets, a real D3D-style perspective projection, and a DynamicVBAccessClass/DynamicIBAccessClass second draw - asserts 6 real pixel-level checks (background integrity, projected-position + color, white-fallback diffuse exactness, additive-blend sum, depth occlusion, dynamic-buffer offset plumbing) against the offscreen FBO. This is Milestone 3's exit criterion." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 4: texture pipeline end-to-end (Tests/RenderTexturePipeline)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-rendertexturepipeline.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-rendertexturepipeline.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Drives the real TextureClass/TextureLoader/TextureFilterClass/MissingTexture/DDSFileClass/BitmapHandlerClass pipeline, including the first real cross-thread (pthread) background texture load on POSIX - asserts 6 real pixel-level checks (foreground TGA load, engine-generated mip chain, DDS/DXT1 software decode, missing-texture fallback, real background-thread load, WRAP/CLAMP sampler addressing) against the offscreen FBO." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 5: real W3D meshes end-to-end (Tests/RenderW3DMesh)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-renderw3dmesh.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-renderw3dmesh.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Authors real .w3d chunk bytes at runtime via ChunkSaveClass, loads them through the real WW3DAssetManager (Load_3D_Assets/Create_Render_Obj), and renders through the real dx8renderer.cpp mesh pipeline - asserts a load round-trip, a textured lit rigid mesh, the Get_Texture cache path, a per-vertex-color mesh, a real HLod hierarchy (pivot-attached rigid sub-meshes), and a bone-deformed skin mesh, verifying each at a CPU-predicted pixel position against the offscreen FBO. This is Milestone 5's exit criterion." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 6: engine-driven frame loop, the milestone's exit criterion (Tests/RenderWW3DFrame)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-renderww3dframe.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-renderww3dframe.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "The first harness in this port driven entirely through WW3D::'s own entry points (Init/Set_Render_Device/Begin_Render/Render/End_Render/Set_Device_Resolution/Shutdown), not DX8Wrapper directly - the structural proof that Milestone 6's Do_Onetime_Device_Dependent_Inits/Shutdowns chain, real Compute_Caps, real Present/End_Scene contract, and portable ww3d.cpp all work together as a real frame loop on GL, in a real (if small) visible window (windowed=1, hosted by Xvfb). Asserts an init round-trip, an engine-driven single frame, a 30-frame loop with an animated transform (verified at frame 0 and frame 29, FrameCount advancing by exactly 30), a window-side present-readback that matches the FBO byte-for-byte, a mid-run resolution change (640x480 -> 800x600) with re-predicted pixel positions, and a clean WW3D::Init->Shutdown teardown cycle." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 7 Task 2: headless file-system harness (Tests/GameFileSystem)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-gamefilesystem.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-gamefilesystem.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "The first GameEngine code (not WW3D2 rendering code) ever to RUN, not merely compile, on POSIX: wires up the real TheFileSystem/TheLocalFileSystem/TheArchiveFileSystem/StdBIGFileSystem/StdLocalFileSystem stack against a test-authored .big archive and a loose local file, on the real GameMemory.cpp allocator, with no GL/display dependency at all." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 7 Task 4: the milestone's exit harness (Tests/RenderGameAssets)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-rendergameassets.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-rendergameassets.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Every byte on screen comes out of a real BIG archive through the engine's own file stack (GameFileClass -> TheFileSystem -> StdBIGFile -> RAMFile), not a loose temp file - the first harness in this port to combine the GameEngine file-system stack (Tasks 1-2) with the unified W3DFileSystem (Task 3) and the WW3D2/GL render stack together. Milestone 7's exit criterion." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 8 Task 4: the milestone's payoff task and exit harness (Tests/RenderRTS3DScene)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-renderrts3dscene.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-renderrts3dscene.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "A pixel rendered through the game's own real scene manager (RTS3DScene, Core/GameEngineDevice's unified W3DScene.cpp) with a real, defaults-constructed GlobalData object underneath it - the first GameClient scene object and the first GlobalData ever constructed and executed on POSIX. Milestone 8's exit criterion." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 9 Task 3: the milestone's payoff task and exit harness (Tests/RenderCameraTransform)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-rendercameratransform.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Run outcome: ${{ steps.run-rendercameratransform.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "The game's own real camera-transform math (W3DView::updateCameraTransform()) driven through the real public camera API (init/setDefaultView/lookAt/setAngle/setPitch/setZoom), on top of a real base TerrainLogic and a real, defaults-constructed GlobalData - the first TerrainLogic and the first W3DView ever constructed and executed on POSIX. Verified via direct-state camera assertions and pixel checks against an independently-reauthored CPU-side reimplementation of the camera math, plus a real Cull_Sphere-based culling check. Milestone 9's exit criterion." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase 5(a) Milestone 10: headless GameLogic tick harness, rung 2b-lite (Tests/GameLogicTickHarness)" >> $GITHUB_STEP_SUMMARY
          echo "Build outcome: ${{ steps.build-gamelogictickharness.outcome }}" >> $GITHUB_STEP_SUMMARY
