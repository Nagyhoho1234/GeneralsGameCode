name: macOS Native Build (advisory - currently-portable subset only)

# Tracks progress against docs/native-port-plan.md. Native port Phase 1
# (build-system gating + GameEngine core Win32 removal) and Phase 2
# (64-bit pointer-width cleanliness) are both done for the currently
# reachable subset of the codebase: Core/GameEngine and
# Core/GameEngineDevice's non-D3D8/non-Win32 sources, for both Generals
# and GeneralsMD. This workflow builds exactly that subset
# (g_gameenginedevice/z_gameenginedevice) using the new macos-arm64
# CMake preset - it does NOT attempt the full game executable, which
# still needs Phase 3-7 (rendering/audio/windowing) before it links.
#
# This is advisory: unlike the standalone native-port-spike graphics
# prototype (macos-spike.yml, already validated on real macos-latest
# CI), the *main game* build via this preset has not yet been run
# against real Apple hardware before this workflow existed - this run
# is that first attempt.
#
# Manually triggered only (not on every push/PR) to avoid CI noise.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  macos-build-attempt:
    name: Build g_gameenginedevice/z_gameenginedevice on macos-latest (advisory)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show toolchain versions
        run: |
          echo "### Toolchain" >> $GITHUB_STEP_SUMMARY
          clang --version | tee -a $GITHUB_STEP_SUMMARY
          cmake --version | tee -a $GITHUB_STEP_SUMMARY
          ninja --version | tee -a $GITHUB_STEP_SUMMARY
          uname -a | tee -a $GITHUB_STEP_SUMMARY

      - name: Install build dependencies (Homebrew)
        run: brew install cmake ninja || true

      - name: Configure (macos-arm64 preset - native, no vcpkg)
        id: configure
        run: cmake --preset macos-arm64 2>&1 | tee configure-log.txt
        continue-on-error: true

      - name: Build g_gameenginedevice (Generals)
        id: build-generals
        if: steps.configure.outcome == 'success'
        run: cmake --build --preset macos-arm64 --target g_gameenginedevice -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Build z_gameenginedevice (Zero Hour)
        id: build-zerohour
        if: steps.configure.outcome == 'success'
        run: cmake --build --preset macos-arm64 --target z_gameenginedevice -- -k0 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Upload configure/build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-attempt-log
          path: configure-log.txt
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### macOS native build attempt (g_gameenginedevice/z_gameenginedevice only)" >> $GITHUB_STEP_SUMMARY
          echo "Configure outcome: ${{ steps.configure.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Build Generals outcome: ${{ steps.build-generals.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Build Zero Hour outcome: ${{ steps.build-zerohour.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Remaining errors, if any, are expected to be only the already-catalogued deferred items in docs/native-port-plan.md (real COM/ATL work, imagehlp.h, d3dx8math.h, mbstring.h) - not pointer-width or build-system issues. See the uploaded log artifact for exact diagnostics." >> $GITHUB_STEP_SUMMARY
