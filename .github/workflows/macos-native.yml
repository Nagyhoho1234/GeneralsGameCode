name: macOS Native Build (advisory, expected to fail until native-port Phase 1 lands)

# Tracks progress against docs/native-port-plan.md. This does NOT yet
# attempt a real native macOS port - there is no macOS-specific CMake
# preset yet, and the game currently cannot even configure on
# non-Windows platforms (Core/GameEngineDevice/CMakeLists.txt links
# d3d8lib/milesstub/binkstub unconditionally, with no WIN32 gate - see
# the plan's Phase 1). This workflow exists so that once Phase 1
# (build-system gating) and Phase 2 (64-bit) land, we get an immediate,
# already-wired-up signal instead of having to write CI from scratch at
# that point. Until then, expect this job to fail at configure or build
# time, and treat that failure output as diagnostic information for
# Phase 0/1, not as a bug in this workflow.
#
# Manually triggered only (not on every push/PR) to avoid CI noise on a
# job that is not expected to pass yet.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  macos-configure-attempt:
    name: Attempt configure + build on macos-latest (advisory)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show toolchain versions
        run: |
          echo "### Toolchain" >> $GITHUB_STEP_SUMMARY
          clang --version | tee -a $GITHUB_STEP_SUMMARY
          cmake --version | tee -a $GITHUB_STEP_SUMMARY
          ninja --version | tee -a $GITHUB_STEP_SUMMARY
          uname -a | tee -a $GITHUB_STEP_SUMMARY

      - name: Install build dependencies (Homebrew)
        run: brew install cmake ninja vcpkg || true

      - name: Attempt configure (reusing the existing 'unix' preset as a stand-in)
        id: configure
        run: |
          export VCPKG_ROOT="$(brew --prefix vcpkg 2>/dev/null || echo /usr/local/share/vcpkg)"
          cmake --preset unix 2>&1 | tee configure-log.txt
        continue-on-error: true

      - name: Attempt build (only if configure succeeded)
        if: steps.configure.outcome == 'success'
        run: cmake --build --preset unix 2>&1 | tee -a configure-log.txt
        continue-on-error: true

      - name: Upload configure/build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-attempt-log
          path: configure-log.txt
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### macOS native build attempt" >> $GITHUB_STEP_SUMMARY
          echo "Configure outcome: ${{ steps.configure.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "This is advisory and expected to fail until docs/native-port-plan.md Phase 1-2 land. See the uploaded log artifact for exactly where it currently stops." >> $GITHUB_STEP_SUMMARY
