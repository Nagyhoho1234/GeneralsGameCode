Object HarnessPlaceholderObject
  End

Object M13NamedUnit
  ; TheSuperHackers @port Milestone 13 (native port plan, Draft 37): a real,
  ; implementation-time finding this milestone's own step-0 spike turned up
  ; (not foreseen by Draft 37) - ThingTemplate::m_assetScale (the "Scale"
  ; field) has NO default member initializer and the real
  ; ThingTemplate::ThingTemplate() constructor never sets it either
  ; (confirmed by reading, not assumed) - only ThingTemplate::initForLTA()
  ; explicitly sets it to 1.0f, a path this milestone's real, INI-parsed
  ; template never goes through. Left unset, Drawable::Drawable()'s own
  ; "m_instanceScale = thingTemplate->getAssetScale();" propagates whatever
  ; value the template's memory happened to contain into
  ; W3DModelDraw::setModelState()'s own "Create_Render_Obj(name,
  ; draw->getScale(), ...)" call - empirically a degenerate (zero-size,
  ; invisible, uncastable) render object in this harness's own real run.
  ; Explicit "Scale = 1.0" guarantees the real, sane default instead of
  ; relying on incidental memory-pool zero-initialization.
  Scale = 1.0
  KindOf = SELECTABLE

  Draw = W3DModelDraw ModuleTag_Draw
    DefaultConditionState
      ; TheSuperHackers @port Milestone 13 (native port plan, Draft 37): a
      ; real, implementation-time finding this milestone's own step-0 spike
      ; turned up - Create_Render_Obj() resolves W3D mesh names in the real
      ; "ContainerName.MeshName" form (matching the authored .w3d's own
      ; W3dMeshHeader3Struct.ContainerName/MeshName, "M13"/"UNIT" - see
      ; main.cpp's own Author_Unit_W3D_Bytes("M13", "UNIT", ...) call), NOT
      ; the bare mesh name alone - confirmed by a real gdb/fprintf trace
      ; showing Create_Render_Obj("m13unit", ...) returning nullptr where
      ; Create_Render_Obj("m13.unit", ...) succeeds.
      Model = M13.UNIT
    End
  End

  Behavior = DestroyDie ModuleTag_Die
  End

  Body = InactiveBody ModuleTag_Body
  End
End

Object M14SecondUnit
  ; TheSuperHackers @port Milestone 14 (native port plan, Draft 38, "closing
  ; rung 3"): a SECOND real, named Object+Drawable, distinct from
  ; "M13NamedUnit" above - a distinct template name, pointed at a distinct
  ; authored mesh/texture pair ("M14.UNIT" / "m14unit.tga", see main.cpp's
  ; own Author_Unit_W3D_Bytes("M14", "UNIT", "m14unit.tga", ...) call),
  ; placed at a distinct world position far enough from M13NamedUnit's own
  ; instance that region-based queries can cleanly distinguish them (see
  ; main.cpp's own UNIT_A_WORLD_POS/UNIT_B_WORLD_POS). Same explicit "Scale
  ; = 1.0" requirement as M13NamedUnit above (this milestone's own step-0
  ; spike reconfirmed the same ThingTemplate::m_assetScale finding applies
  ; per-template, not just once globally).
  Scale = 1.0
  KindOf = SELECTABLE

  Draw = W3DModelDraw ModuleTag_Draw
    DefaultConditionState
      Model = M14.UNIT
    End
  End

  Behavior = DestroyDie ModuleTag_Die
  End

  Body = InactiveBody ModuleTag_Body
  End
End
